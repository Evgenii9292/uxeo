
<!DOCTYPE html>
<html lang="ru" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta http-equiv="Content-Language" content="ru" />
    <meta name="google" content="notranslate" />
    <meta name="theme-color" content="#282F33" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Skillum" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" href="/app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/logo-splash.svg" as="image" fetchpriority="high" />
    <title>Skillum — обучение через практику</title>
  </head>

  <script>
    document.documentElement.dataset.skillumSplash = location.pathname === "/welcome" || location.pathname === "/" ? "on" : "off";
  </script>
  <style>
    html[data-skillum-splash="off"] #splash {
      display: none;
    }
    #splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: linear-gradient(165.05deg, #282F33 14.367%, rgb(46, 57, 62) 147.74%);
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    #splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    #splash img {
      width: min(286px, 52vw);
      height: auto;
    }
    #splash p {
      font-family: 'Roboto Condensed', sans-serif;
      font-size: 16px;
      line-height: 1.45;
      color: rgba(121, 133, 137, 0.7);
      letter-spacing: 0.02em;
      text-align: center;
      margin: 0;
    }
  </style>
  <body>
    <div id="splash">
      <img src="/logo-splash.svg" alt="Skillum" width="286" height="69" fetchpriority="high" />
      <p>Интерактивное обучение дизайну<br>через практику</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      window.gtag = function(){ window.dataLayer.push(arguments); };
      function loadAnalytics(){
        if (window.__skillumAnalyticsLoaded) return;
        window.__skillumAnalyticsLoaded = true;
        var script = document.createElement('script');
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtag/js?id=G-K75VZFCQYC';
        document.head.appendChild(script);
        window.gtag('js', new Date());
        window.gtag('config', 'G-K75VZFCQYC');
      }
      window.addEventListener('load', function(){ setTimeout(loadAnalytics, 8000); }, { once: true });
    </script>
  </body>
</html>
